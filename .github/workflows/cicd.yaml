name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write 
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-arn: ${{ secrets.GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1 
          role-session-name: GitHubActionsTerraform

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0  

      - name: Terraform Init
        run: terraform init -backend-config="envs/${TF_ENV}/backend.hcl"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan -var-file="envs/${TF_ENV}/terraform.tfvars" -var="db_username=${{ secrets.DB_USERNAME }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" -var="my_ip=${{ secrets.MY_IP }}" -var="public_key_path=${{ secrets.PUBLIC_KEY_PATH }}"

      - name: Terraform Apply (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -var-file="envs/${TF_ENV}/terraform.tfvars" -var="db_username=${{ secrets.DB_USERNAME }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" -var="my_ip=${{ secrets.MY_IP }}" -var="public_key_path=${{ secrets.PUBLIC_KEY_PATH }}"

      - name: Terraform Destroy (Optional Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var-file="envs/${TF_ENV}/terraform.tfvars" -var="db_username=${{ secrets.DB_USERNAME }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" -var="my_ip=${{ secrets.MY_IP }}" -var="public_key_path=${{ secrets.PUBLIC_KEY_PATH }}"
